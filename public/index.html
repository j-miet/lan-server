<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>LAN Server</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="favicon.png" />
  </head>
  <body>
    <div class="container">
      <header class="page-header">
        <div>
          <h1>Server Control Panel</h1>
        </div>

        <button
          class="logout-btn"
          onclick="
            fetch('/api/logout', { method: 'POST' }).then(() =>
              window.location.replace('/login.html'),
            )
          "
        >
          Logout
        </button>
      </header>

      <section class="panel">
        <div class="section-header">
          <h2>Terminal</h2>
        </div>

        <div class="terminal-wrapper">
          <div class="terminal-controls">
            <button class="terminal-color-btn c1" data-color="#0f0"></button>
            <button class="terminal-color-btn c2" data-color="orange"></button>
            <button class="terminal-color-btn c3" data-color="#1e90ff"></button>
            <button class="terminal-color-btn c4" data-color="#ff5f56"></button>
            <button
              class="terminal-color-btn c5"
              data-color="darkgray"
            ></button>
            <button class="terminal-color-btn c6" data-color="white"></button>
          </div>

          <div id="terminal-container">
            <span id="terminal-title"></span>
            <p></p>
            <div id="script-output"></div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="section-header">
          <h2>Scripts</h2>
        </div>

        <div id="script-container"></div>
        <div id="script-form-container"></div>
      </section>

      <section class="panel">
        <div class="section-header">
          <h2>Files</h2>
        </div>

        <div id="drop-zone">Click or drag files here to upload</div>

        <input type="file" id="file-input" multiple hidden />

        <div id="upload-status">
          <div id="upload-queue"></div>
        </div>

        <div class="file-toolbar">
          <input type="text" id="file-search" placeholder="Search files..." />

          <select id="file-sort">
            <option value="name" selected>Name</option>
            <option value="type">Type</option>
            <option value="size">Size</option>
            <option value="modified">Date</option>
          </select>

          <button id="file-sort-order">↑</button>
        </div>

        <div id="file-list">Loading...</div>
      </section>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
