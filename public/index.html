<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>LAN Server</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="favicon.png" />
  </head>
  <body>
    <div class="container">
      <h1 style="margin-bottom: 0px">LAN Server</h1>

      <div style="position: fixed; top: 16px; right: 24px">
        <button
          onclick="
            fetch('/api/logout', { method: 'POST' }).then(() =>
              window.location.replace('/login.html'),
            )
          "
        >
          Logout
        </button>
      </div>

      <div class="terminal-wrapper">
        <div class="terminal-controls">
          <button class="terminal-color-btn c1" data-color="#0f0"></button>
          <button class="terminal-color-btn c2" data-color="orange"></button>
          <button class="terminal-color-btn c3" data-color="#1e90ff"></button>
          <button class="terminal-color-btn c4" data-color="#ff5f56"></button>
          <button class="terminal-color-btn c5" data-color="darkgray"></button>
          <button class="terminal-color-btn c6" data-color="white"></button>
        </div>

        <div id="terminal-container">
          -- Script window --
          <div id="script-output"></div>
        </div>
      </div>

      <h2>Scripts</h2>
      <div id="script-container"></div>
      <div id="script-form-container"></div>
      <hr style="height: 3px; background-color: #333" />

      <h2>Files</h2>
      <div id="drop-zone">Drag files here for uploading</div>

      <div id="upload-status">
        <div id="progress-container">
          <div id="progress-bar"></div>
        </div>

        <span id="upload-file-name"></span>
      </div>

      <input type="file" id="file-input" hidden />

      <div id="file-list">Loading...</div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
