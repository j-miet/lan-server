<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>LAN Server</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>LAN Server</h1>
        <div id="drop-zone">
            Drag files here for uploading
        </div>

        <div id="upload-status">
             <div id="progress-container">
                <div id="progress-bar"></div>
            </div>

            <span id="upload-file-name"></span>
        </div>

        <input type="file" id="file-input" hidden>

        <h2>Files</h2>
        <div id="file-list">
            Loading...
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
